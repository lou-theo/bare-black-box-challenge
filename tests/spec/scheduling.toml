category = "scheduling"
category_description = "Comportement d'optimisation (overlap, adjacency, ordre des intervalles, et enumeration des ties via OR)."

[[case]]
id = "SCH-001"
description = "Cas minimal valide sur un seul intervalle."
input = "1 2 3 4\n"
expected_output = "1 4\n"
expected_code = 0

[[case]]
id = "SCH-002"
description = "Deux intervalles non chevauchants sont additionnes."
input = "1 2 3 4 5 6 7 8\n"
expected_output = "1 4\n5 12\n"
expected_code = 0

[[case]]
id = "SCH-003"
description = "La meilleure combinaison l'emporte sur un intervalle long."
input = "1 0 5 100 2 0 2 60 3 2 1 60\n"
expected_output = "2 60\n3 120\n"
expected_code = 0

[[case]]
id = "SCH-004"
description = "Chevauchement: choix de la valeur la plus elevee."
input = "1 0 3 10 2 1 3 50\n"
expected_output = "2 50\n"
expected_code = 0

[[case]]
id = "SCH-005"
description = "Intervalles adjacents non chevauchants: addition."
input = "1 0 2 10 2 2 2 20\n"
expected_output = "1 10\n2 30\n"
expected_code = 0

[[case]]
id = "SCH-006"
description = "Intervalles non tries en entree: resultat stable."
input = "2 5 2 30 1 0 5 40 3 7 1 50\n"
expected_output = "1 40\n2 70\n3 120\n"
expected_code = 0

[[case]]
id = "SCH-007"
description = "Combinaison de deux intervalles > intervalle unique."
input = "1 0 10 100 2 0 5 60 3 5 5 60\n"
expected_output = "2 60\n3 120\n"
expected_code = 0

[[case]]
id = "SCH-008"
description = "Deux intervalles separes de 128 ans ne doivent pas se chevaucher."
input = "1 0 1 10 2 65536 1 20\n"
expected_output = "1 10\n2 30\n"
expected_code = 0

[[case]]
id = "SCH-009"
description = "Deux intervalles tres eloignes (year=32 vs year=100000) doivent etre compatibles."
input = "1 16384 1 10 2 51200000 1 20\n"
expected_output = "1 10\n2 30\n"
expected_code = 0

[[case]]
id = "SCH-010"
description = "Exemple cible: sortie sur les ordres retenus avec cumul progressif."
input = "0 0 5 10\n1 3 7 14\n2 5 9 7\n3 6 9 8\n"
expected_output = "0 10\n3 18\n"
expected_code = 0

[[case]]
id = "SCH-011"
description = "Egalite de valeur optimale: toutes les possibilites sont affichees avec separateur OR."
input = "5 0 2 5 1 0 2 5 3 2 2 5\n"
expected_output = "1 5\n3 10\nOR\n5 5\n3 10\n"
expected_code = 0
