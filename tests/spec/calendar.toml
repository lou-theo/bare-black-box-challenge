category = "calendar"
category_description = "Validation du champ start (year/day, index day sur base 0, regles bissextiles gregoriennes, borne annee <= 100000)."

# Convention importante pour ces cas:
# - day est un index de jour dans l'annee (base 0), pas un numero humain 1..365/366
# - annee normale: day valide dans 0..364 (365 jours au total)
# - annee bissextile: day valide dans 0..365 (366 jours au total)
# - day=366 signifierait un 367e jour et doit toujours etre invalide
# - leap (gregorien): divisible par 4, sauf siecles non divisibles par 400

[[case]]
id = "CAL-001"
description = "Year=8 bissextile, day=365 valide."
input = "1 4461 1 99\n"
expected_output = "1 99\n"
expected_code = 0

